<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direction Générale des Douanes - CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

        :root {
            --admin-blue: #0c4a6e;
            --admin-gold: #d4af37;
            --bg-dark: #010409;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(212, 175, 55, 0.3);
        }

        body {
            background: var(--bg-dark);
            color: #e6edf3;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 0% 0%, #0c4a6e 0%, transparent 35%),
                        radial-gradient(circle at 100% 100%, #020617 0%, transparent 35%);
            z-index: -1;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .logo-fixe { height: 110px; width: auto; object-fit: contain; }

        .title-block { text-align: center; }
        .main-title { font-size: 2.8rem; font-weight: 800; color: #ffffff; margin-bottom: 5px; }
        .subtitle { font-size: 1.6rem; color: var(--admin-gold); font-weight: 400; text-transform: uppercase; letter-spacing: 2px; }

        /* CONTENU */
        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 60% 40%;
            gap: 40px;
            padding: 30px 60px;
            overflow: hidden;
        }

        .section-label {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--admin-gold);
            width: fit-content;
            padding-bottom: 5px;
        }

        .specialties-list { display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 4px solid var(--admin-gold);
            border-radius: 8px;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card.show { opacity: 1; transform: translateX(0); }

        .spec-info h3 { font-size: 2.4rem; font-weight: 700; color: #fff; }
        .spec-time { 
            font-size: 2.2rem; 
            font-family: 'Segoe UI Mono', monospace; 
            color: var(--admin-gold); 
            background: rgba(212, 175, 87, 0.1);
            padding: 5px 20px;
            border-radius: 4px;
        }

        /* CLOCK */
        .clock-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .time { font-size: 8rem; font-weight: 800; color: #ffffff; text-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        .date { font-size: 2rem; color: #8b949e; margin-top: 10px; }

        /* TICKER BAR - ANIMATION PAR JAVASCRIPT PUR */
        .ticker-bar {
            height: 80px;
            background: var(--admin-blue);
            border-top: 2px solid var(--admin-gold);
            position: relative;
            overflow: hidden;
        }

        /* Ticker Français (haut) */
        .ticker-fr {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(12, 74, 110, 0.9);
        }

        .ticker-fr-content {
            display: flex;
            white-space: nowrap;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            align-items: center;
        }

        /* Ticker Arabe (bas) */
        .ticker-ar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: rgba(12, 74, 110, 0.7);
        }

        .ticker-ar-content {
            display: flex;
            white-space: nowrap;
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            align-items: center;
            direction: rtl;
        }

        .ticker-item {
            font-size: 1.5rem;
            font-weight: 500;
            color: white;
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 100%;
            flex-shrink: 0;
        }

        .ticker-day { 
            color: var(--admin-gold); 
            font-weight: 800; 
            margin-right: 15px; 
            margin-left: 15px;
            background: rgba(212, 175, 55, 0.1);
            padding: 5px 15px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            height: 70%;
            flex-shrink: 0;
        }

        .separator {
            color: var(--admin-gold);
            font-weight: bold;
            font-size: 1.8rem;
            padding: 0 30px;
        }

        [dir="rtl"] .card { border-left: none; border-right: 4px solid var(--admin-gold); }
    </style>
</head>
<body>

    <header class="header">
        <img src="d2.jpg" class="logo-fixe" onerror="this.style.opacity='0'">
        <div class="title-block">
            <h1 class="main-title" id="mainTitle">Direction Générale des Douanes</h1>
            <p class="subtitle" id="subtitle">Centre Médical Social – Sidi Bel Abbès</p>
        </div>
        <img src="d1.png" class="logo-fixe" onerror="this.style.opacity='0'">
    </header>

    <main class="content">
        <section>
            <div class="section-label">
                <i class="fas fa-calendar-day" style="color: var(--admin-gold);"></i>
                <span id="labelToday">Planning du Jour</span>
            </div>
            <div id="listToday" class="specialties-list"></div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 30px;">
            <div class="clock-box">
                <div class="time" id="clockTime">00:00</div>
                <div class="date" id="clockDate">...</div>
            </div>
            <div style="text-align: center; padding: 25px; border: 1px solid var(--border); border-radius: 8px; background: rgba(212, 175, 55, 0.05);">
                <p id="footerMsg" style="font-style: italic; color: #8b949e; font-size: 1.3rem;"></p>
            </div>
        </section>
    </main>

    <!-- TICKERS ANIMÉS PAR JAVASCRIPT -->
    <footer class="ticker-bar">
        <div class="ticker-fr">
            <div class="ticker-fr-content" id="tickerFrContent"></div>
        </div>
        <div class="ticker-ar">
            <div class="ticker-ar-content" id="tickerArContent"></div>
        </div>
    </footer>

    <script>
        // ===== DONNÉES =====
        const fullPlanning = {
            dimanche: [
                { fr: "Gastro-entérologie", ar: "أمراض الجهاز الهضمي", time: "12:00–14:00" },
                { fr: "Pneumologie", ar: "أمراض الصدر", time: "13:00–15:00" },
                { fr: "Réadaptation", ar: "إعادة التأهيل", time: "11:30–15:30" },
                { fr:"Neurochirurgie", ar: "جراحة الأعصاب", time: "08:00–12:00" },
                {fr:"kinésithérapie", ar: "العلاج الطبيعي", time: "13:30–15:30" }
            ],
            lundi: [
                { fr: "Endocrinologie", ar: "الغدد الصماء", time: "11:30–15:30" },
                { fr: "Cardiologie", ar: "أمراض القلب", time: "11:30–15:30" },
                { fr: "Urologie", ar: "المسالك البولية", time: "08:00–12:00" },
                { fr: "ORL", ar: "أنف وأذن وحنجرة", time: "13:00–15:00" }
            ],
            mardi: [
                {fr:"Ophtalmologie", ar: "طب العيون", time: "08:00–15:30" },
                { fr:"Dermatologie", ar: "الأمراض الجلدية", time: "12:30–14:30" },
                {fr:"Pediatrie", ar: "طب الأطفال", time: "08:00–15:30" },
                {fr:"Psychiatrie", ar: "الطب النفسي", time: "11:30–15:30" },
                {fr:"Orthophoniste", ar: "جراحة العظام", time: "08:00–12:00" },
                { fr: "Traumatologie", ar: "جراحة العظام", time: "12:00–15:00" }
            ],
            mercredi: [
                { fr: "Ophtalmologie", ar: "طب العيون", time: "08:00–15:30" },
                { fr: "Dermatologie", ar: "الأمراض الجلدية", time: "12:30–14:30" },
                { fr: "Cardiologie", ar: "أمراض القلب", time: "11:30–15:30" }
            ],
            jeudi: [
                {fr:"Ccirculatoire", ar: "الأمراض الدموية", time: "10:00–14:00" },
                { fr: "Gastro-entérologie", ar: "أمراض الجهاز الهضمي", time: "12:00–14:00" },
                { fr: "Pneumologie", ar: "أمراض الصدر", time: "13:00–15:00" },
                {fr:"Endocrinologie", ar: "الغدد الصماء", time: "11:30–15:30" },
                {fr:"Nephrologie", ar: "أمراض الكلى", time: "08:00–12:00" },
                {fr:"Genecologie", ar: "طب النساء والتوليد", time: "08:00–12:00" },
                { fr: "Kinésithérapie", ar: "العلاج الطبيعي", time: "13:30–15:30" },
                { fr: "ORL", ar: "أنف وأذن وحنجرة", time: "13:30–15:30" }
            ]
        };

        const days = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
        const daysAr = {
            dimanche: "الأحد", 
            lundi: "الإثنين", 
            mardi: "الثلاثاء", 
            mercredi: "الأربعاء", 
            jeudi: "الخميس"
        };
        
        let currentLang = 'fr';
        let frTickerAnimation = null;
        let arTickerAnimation = null;
        let frTickerPosition = 0;
        let arTickerPosition = 0;
        let frTickerSpeed = 0.5; // pixels par frame
        let arTickerSpeed = 0.5; // pixels par frame

        // ===== FONCTIONS DU CONTENU CENTRAL =====
        function updateClock() {
            const now = new Date();
            const timeEl = document.getElementById('clockTime');
            const dateEl = document.getElementById('clockDate');
            
            if (timeEl) {
                timeEl.textContent = now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
            }
            if (dateEl) {
                dateEl.textContent = now.toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'ar-DZ', { 
                    weekday: 'long', 
                    day: 'numeric', 
                    month: 'long' 
                });
            }
        }

        function changeContentLanguage() {
            currentLang = (currentLang === 'fr') ? 'ar' : 'fr';
            const todayIdx = new Date().getDay();
            const todayKey = days[todayIdx] || "dimanche";
            
            if(currentLang === 'ar') {
                document.documentElement.dir = "rtl";
                document.getElementById('mainTitle').textContent = "المديرية العامة للجمارك";
                document.getElementById('subtitle').textContent = "المركز الطبي الاجتماعي – سيدي بلعباس";
                document.getElementById('labelToday').textContent = "برنامج الفحوصات اليومية";
                document.getElementById('footerMsg').textContent = "يرجى الالتزام بمواعيد الفحص الطبي";
            } else {
                document.documentElement.dir = "ltr";
                document.getElementById('mainTitle').textContent = "Direction Générale des Douanes";
                document.getElementById('subtitle').textContent = "Centre Médical Social – Sidi Bel Abbès";
                document.getElementById('labelToday').textContent = "Planning des Consultations";
                document.getElementById('footerMsg').textContent = "Veuillez respecter les horaires de consultation";
            }
            
            renderToday(todayKey);
            updateClock();
        }

        function renderToday(dayKey) {
            const list = document.getElementById('listToday');
            if (!list) return;
            
            list.innerHTML = '';
            const progs = fullPlanning[dayKey] || [];
            
            progs.forEach((p, index) => {
                const name = (currentLang === 'fr') ? p.fr : p.ar;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="spec-info"><h3>${name}</h3></div><div class="spec-time">${p.time}</div>`;
                list.appendChild(card);
                setTimeout(() => card.classList.add('show'), index * 100);
            });
        }

        // ===== ANIMATION DES TICKERS PAR REQUESTANIMATIONFRAME =====
        function createFrenchTicker() {
            const container = document.getElementById('tickerFrContent');
            if (!container) return;
            
            let tickerContent = '';
            
            // Générer un contenu très long (4 cycles)
            for (let cycle = 0; cycle < 4; cycle++) {
                Object.keys(fullPlanning).forEach(dayKey => {
                    tickerContent += `<span class="ticker-item">`;
                    tickerContent += `<span class="ticker-day">${dayKey.toUpperCase()}</span>`;
                    fullPlanning[dayKey].forEach((p, i) => {
                        tickerContent += `${p.fr} (${p.time})`;
                        if (i < fullPlanning[dayKey].length - 1) tickerContent += ' • ';
                    });
                    tickerContent += `</span>`;
                });
                tickerContent += `<span class="separator">✦</span>`;
            }
            
            container.innerHTML = tickerContent;
            
            // Démarrer l'animation
            animateFrenchTicker();
        }

        function createArabicTicker() {
            const container = document.getElementById('tickerArContent');
            if (!container) return;
            
            let tickerContent = '';
            
            // Générer un contenu très long (4 cycles)
            for (let cycle = 0; cycle < 4; cycle++) {
                Object.keys(fullPlanning).forEach(dayKey => {
                    tickerContent += `<span class="ticker-item">`;
                    tickerContent += `<span class="ticker-day">${daysAr[dayKey]}</span>`;
                    fullPlanning[dayKey].forEach((p, i) => {
                        tickerContent += `${p.ar} (${p.time})`;
                        if (i < fullPlanning[dayKey].length - 1) tickerContent += ' • ';
                    });
                    tickerContent += `</span>`;
                });
                tickerContent += `<span class="separator">✦</span>`;
            }
            
            container.innerHTML = tickerContent;
            
            // Démarrer l'animation
            animateArabicTicker();
        }

        function animateFrenchTicker() {
            const container = document.getElementById('tickerFrContent');
            if (!container) return;
            
            const containerWidth = container.scrollWidth / 2; // On divise par 2 car on a 4 cycles
            
            function animate() {
                frTickerPosition -= frTickerSpeed;
                
                // Réinitialiser la position quand on arrive à la fin
                if (frTickerPosition <= -containerWidth) {
                    frTickerPosition = 0;
                }
                
                container.style.transform = `translateX(${frTickerPosition}px)`;
                frTickerAnimation = requestAnimationFrame(animate);
            }
            
            // Annimer toute animation existante
            if (frTickerAnimation) {
                cancelAnimationFrame(frTickerAnimation);
            }
            
            animate();
        }

        function animateArabicTicker() {
            const container = document.getElementById('tickerArContent');
            if (!container) return;
            
            const containerWidth = container.scrollWidth / 2; // On divise par 2 car on a 4 cycles
            
            function animate() {
                arTickerPosition += arTickerSpeed;
                
                // Réinitialiser la position quand on arrive à la fin
                if (arTickerPosition >= containerWidth) {
                    arTickerPosition = 0;
                }
                
                container.style.transform = `translateX(${arTickerPosition}px)`;
                arTickerAnimation = requestAnimationFrame(animate);
            }
            
            // Annimer toute animation existante
            if (arTickerAnimation) {
                cancelAnimationFrame(arTickerAnimation);
            }
            
            animate();
        }

        // Fonction pour redémarrer les animations si nécessaire
        function restartTickerAnimations() {
            if (!frTickerAnimation) {
                animateFrenchTicker();
            }
            if (!arTickerAnimation) {
                animateArabicTicker();
            }
        }

        // ===== INITIALISATION =====
        document.addEventListener('DOMContentLoaded', () => {
            // Initialiser les tickers
            createFrenchTicker();
            createArabicTicker();
            
            // Initialiser le contenu
            updateClock();
            const todayIdx = new Date().getDay();
            const todayKey = days[todayIdx] || "dimanche";
            renderToday(todayKey);
            
            // Démarrer les intervalles
            setInterval(updateClock, 1000);
            
            // Changement de langue du contenu central seulement
            setInterval(changeContentLanguage, 10000);
            
            // Mettre à jour le planning chaque minute
            setInterval(() => {
                const newTodayIdx = new Date().getDay();
                const newTodayKey = days[newTodayIdx] || "dimanche";
                renderToday(newTodayKey);
            }, 60000);
            
            // Redémarrer les animations après un court délai pour être sûr
            setTimeout(restartTickerAnimations, 1000);
            
            // Redémarrer les animations si la page devient visible
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    setTimeout(restartTickerAnimations, 100);
                }
            });
        });

        // Garantir que les animations continuent même en cas d'erreur
        window.addEventListener('error', restartTickerAnimations);
        
        // Redémarrer toutes les 5 minutes au cas où
        setInterval(restartTickerAnimations, 300000);
    </script>
</body>
</html>
