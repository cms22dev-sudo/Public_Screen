<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS – Douanes Algériennes</title>

<!-- Polices Premium pour Écran TV -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Mono:wght@400;700&family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ========== RESET & VARIABLES ========== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#0047AB;
    --primary-dark:#002D6B;
    --accent:#FFB000;
    --accent-bright:#FFC933;
    --dark:#0A0E1A;
    --dark-card:#0F1420;
    --white:#FFFFFF;
    --surface:rgba(15,20,32,.95);
    
    --font-display:'Outfit',sans-serif;
    --font-mono:'Space Mono',monospace;
    --font-ar:'Cairo',sans-serif;
}

html, body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:var(--font-display);
    color:var(--white);
    background:var(--dark);
    position:relative;
}

/* ========== ANIMATED BACKGROUND ========== */
.bg-container{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;

    /* ✅ Background image */
    background:
        /* dark overlay for readability */
        linear-gradient(rgba(10,14,26,.75), rgba(10,14,26,.75)),
        url("facade.png") center/cover no-repeat,

        /* ✅ keep your nice gradients on top */
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,71,171,.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,176,0,.12), transparent);
}

.bg-grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(0,71,171,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,71,171,.08) 1px, transparent 1px);
    background-size:60px 60px;
    animation:gridScroll 40s linear infinite;
    opacity:.4;
}

@keyframes gridScroll{
    0%{transform:translate(0,0)}
    100%{transform:translate(60px,60px)}
}

.bg-orbs{
    position:absolute;
    inset:0;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.15;
    animation:float 20s ease-in-out infinite;
}

.orb-1{
    width:500px;
    height:500px;
    background:var(--primary);
    top:10%;
    left:10%;
    animation-delay:0s;
}

.orb-2{
    width:400px;
    height:400px;
    background:var(--accent);
    bottom:15%;
    right:15%;
    animation-delay:5s;
}

@keyframes float{
    0%, 100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(50px,-30px) scale(1.1)}
    66%{transform:translate(-30px,40px) scale(.9)}
}

/* ========== HEADER ========== */
.header{
    position:relative;
    z-index:10;
    display:grid;
    grid-template-columns:200px 1fr 200px;
    align-items:center;
    gap:40px;
    padding:30px 70px;
    background:linear-gradient(180deg, 
        rgba(15,20,32,.98) 0%, 
        rgba(15,20,32,.92) 100%);
    backdrop-filter:blur(20px) saturate(180%);
    border-bottom:2px solid rgba(255,176,0,.3);
    box-shadow:0 4px 30px rgba(0,0,0,.4);
}

.logo-box{
    width:180px;
    height:180px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-box::before{
    content:"";
    position:absolute;
    inset:-3px;
    background:linear-gradient(135deg, var(--accent), var(--primary));
    border-radius:28px;
    opacity:.4;
    animation:logoGlow 4s ease-in-out infinite alternate;
}

@keyframes logoGlow{
    0%{opacity:.3; filter:blur(8px)}
    100%{opacity:.5; filter:blur(12px)}
}

.logo-box::after{
    content:"";
    position:absolute;
    inset:0;
    background:var(--dark-card);
    border-radius:25px;
    border:2px solid rgba(255,176,0,.2);
}

.logo{
    position:relative;
    z-index:1;
    width:140px;
    height:140px;
    object-fit:contain;
    filter:drop-shadow(0 4px 20px rgba(255,176,0,.4));
}

.header-title{
    text-align:center;
}

.header-title h1{
    font-size:3.8rem;
    font-weight:900;
    letter-spacing:-1px;
    margin-bottom:12px;
    background:linear-gradient(135deg, 
        var(--white) 0%, 
        var(--accent-bright) 50%,
        var(--white) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    animation:headerShine 6s linear infinite;
    transition:all 0.6s ease;
}

.header-title h1[dir="rtl"]{
    font-family:var(--font-ar);
    letter-spacing:0;
}

@keyframes headerShine{
    0%, 100%{background-position:0% center}
    50%{background-position:200% center}
}

.header-title p{
    font-size:2rem;
    font-weight:600;
    color:var(--accent);
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:0 2px 20px rgba(255,176,0,.5);
    transition:all 0.6s ease;
}

.header-title p[dir="rtl"]{
    font-family:var(--font-ar);
    letter-spacing:2px;
    text-transform:none;
}

/* ========== MAIN LAYOUT ========== */
.main-container{
    position:relative;
    z-index:5;
    height:calc(100vh - 380px);
    display:grid;
    grid-template-columns:1fr 450px;
    gap:60px;
    padding:60px 80px;
    align-items:center;
}

/* ========== SPECIALTY CARD ========== */
.specialty-stage{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1500px;
}

.specialty-card{
    width:100%;
    max-width:1000px;
    padding:90px 120px;
    background:var(--surface);
    border-radius:45px;
    position:relative;
    text-align:center;
    backdrop-filter:blur(20px);
    box-shadow:
        0 30px 90px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.08);
    transform-style:preserve-3d;
}

/* Border gradient animé */
.specialty-card::before{
    content:"";
    position:absolute;
    inset:-4px;
    background:linear-gradient(135deg,
        var(--primary) 0%,
        var(--accent) 25%,
        var(--primary) 50%,
        var(--accent) 75%,
        var(--primary) 100%);
    background-size:400% 400%;
    border-radius:45px;
    z-index:-1;
    animation:borderFlow 8s ease infinite;
}

@keyframes borderFlow{
    0%, 100%{background-position:0% 50%}
    50%{background-position:100% 50%}
}

/* Effet de profondeur */
.specialty-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 30% 30%, rgba(0,71,171,.15), transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(255,176,0,.1), transparent 60%);
    border-radius:45px;
    pointer-events:none;
}

.specialty-content{
    position:relative;
    z-index:1;
    transform:translateZ(30px);
}

.specialty-name{
    font-size:6.5rem;
    font-weight:900;
    line-height:1.1;
    margin-bottom:50px;
    font-family:var(--font-display);
    background:linear-gradient(135deg,
        var(--white) 0%,
        var(--accent-bright) 40%,
        var(--white) 60%,
        var(--accent-bright) 100%);
    background-size:300% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    filter:drop-shadow(0 4px 30px rgba(255,176,0,.3));
    animation:textFlow 8s linear infinite;
}

.specialty-name[dir="rtl"]{
    font-family:var(--font-ar);
    letter-spacing:0;
}

@keyframes textFlow{
    0%, 100%{background-position:0% center}
    50%{background-position:100% center}
}

.specialty-time{
    display:inline-flex;
    align-items:center;
    gap:20px;
    font-size:4.2rem;
    font-weight:700;
    font-family:var(--font-mono);
    color:var(--accent-bright);
    background:linear-gradient(135deg,
        rgba(255,176,0,.15),
        rgba(0,71,171,.15));
    padding:30px 90px;
    border-radius:25px;
    border:3px solid rgba(255,176,0,.3);
    box-shadow:
        0 15px 50px rgba(255,176,0,.25),
        inset 0 1px 0 rgba(255,255,255,.15);
    position:relative;
    overflow:hidden;
}

.specialty-time::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:conic-gradient(from 0deg,
        transparent,
        rgba(255,176,0,.2),
        transparent 30%);
    animation:timeRotate 6s linear infinite;
}

@keyframes timeRotate{
    to{transform:rotate(360deg)}
}

.specialty-time span{
    position:relative;
    z-index:1;
}

/* ========== TRANSITIONS ========== */
@keyframes enterStage{
    0%{
        opacity:0;
        transform:translate3d(-120px, 50px, -80px) rotateY(-15deg) scale(.88);
        filter:blur(20px);
    }
    60%{
        opacity:.9;
        filter:blur(5px);
    }
    100%{
        opacity:1;
        transform:translate3d(0, 0, 0) rotateY(0) scale(1);
        filter:blur(0);
    }
}

@keyframes exitStage{
    0%{
        opacity:1;
        transform:translate3d(0, 0, 0) rotateY(0) scale(1);
        filter:blur(0);
    }
    40%{
        opacity:.8;
        filter:blur(3px);
    }
    100%{
        opacity:0;
        transform:translate3d(120px, -50px, -80px) rotateY(15deg) scale(.88);
        filter:blur(20px);
    }
}

.transition-enter{
    animation:enterStage 1.4s cubic-bezier(.23,1,.32,1);
}

.transition-exit{
    animation:exitStage 1s cubic-bezier(.6,-.28,.735,.045);
}

/* ========== INFO PANEL ========== */
.info-panel{
    display:flex;
    flex-direction:column;
    gap:35px;
    height:100%;
    justify-content:center;
}

.info-card{
    background:var(--surface);
    padding:45px 55px;
    border-radius:35px;
    border:2px solid rgba(0,71,171,.3);
    backdrop-filter:blur(20px);
    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;
    overflow:hidden;
}

.info-card::before{
    content:"";
    position:absolute;
    top:-100%;
    left:-50%;
    width:200%;
    height:300%;
    background:linear-gradient(45deg,
        transparent 40%,
        rgba(255,176,0,.08) 50%,
        transparent 60%);
    animation:cardSweep 8s linear infinite;
}

@keyframes cardSweep{
    0%{transform:translateY(0)}
    100%{transform:translateY(100%)}
}

.info-label{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:1.5rem;
    font-weight:700;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:18px;
    position:relative;
    z-index:1;
}

.info-label i{
    font-size:1.8rem;
}

.clock-display{
    font-size:6rem;
    font-weight:900;
    font-family:var(--font-mono);
    letter-spacing:6px;
    background:linear-gradient(135deg,
        var(--white) 0%,
        var(--accent-bright) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    filter:drop-shadow(0 4px 25px rgba(255,176,0,.4));
    position:relative;
    z-index:1;
}

.date-display{
    font-size:2.4rem;
    font-weight:700;
    color:var(--white);
    line-height:1.5;
    text-transform:capitalize;
    position:relative;
    z-index:1;
    transition:all 0.6s ease;
}

.date-display[dir="rtl"]{
    font-family:var(--font-ar);
    text-transform:none;
}

.info-label span{
    transition:all 0.6s ease;
}

.info-label[dir="rtl"] span{
    font-family:var(--font-ar);
}

/* ========== TICKER BAR - CORRIGÉ ========== */
.ticker-container{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:120px;
    background:linear-gradient(180deg,
        rgba(0,71,171,.98) 0%,
        rgba(0,45,107,.98) 100%);
    border-top:3px solid var(--accent);
    box-shadow:0 -8px 40px rgba(0,0,0,.6);
    z-index:20;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.ticker-lane{
    flex:1;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
}

.ticker-lane:first-child{
    border-bottom:2px solid rgba(255,255,255,.12);
}

.ticker-track{
    position:absolute;
    display:flex;
    align-items:center;
    height:100%;
    white-space:nowrap;
    will-change:transform;
    animation-duration:400s;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    animation-play-state:running;
}

/* Animation pour français (de droite à gauche) */
.ticker-track.french{
    left:0;
    animation-name:tickerScroll;
}

/* Animation pour arabe (de gauche à droite - corrigé) */
.ticker-track.arabic{
    right:0;
    direction:rtl;
    animation-name:tickerScrollArabic;
}

@keyframes tickerScroll{
    0%{transform:translateX(0)}
    100%{transform:translateX(-50%)}
}

@keyframes tickerScrollArabic{
    0%{transform:translateX(0)}
    100%{transform:translateX(50%)}
}

.ticker-lane:hover .ticker-track{
    animation-play-state:paused;
}

.ticker-segment{
    display:inline-flex;
    align-items:center;
    padding-right:80px;
    direction:rtl; /* Pour le contenu arabe */
}

.welcome-badge{
    display:inline-flex;
    align-items:center;
    gap:15px;
    font-size:2.4rem;
    font-weight:900;
    color:var(--accent-bright);
    text-transform:uppercase;
    letter-spacing:2px;
    margin:0 60px;
    padding:12px 40px;
    background:rgba(255,176,0,.15);
    border-radius:50px;
    border:2px solid rgba(255,176,0,.4);
    text-shadow:0 2px 15px rgba(255,176,0,.6);
}

.day-marker{
    font-size:2.2rem;
    font-weight:900;
    color:var(--accent-bright);
    margin:0 35px 0 60px;
    text-transform:uppercase;
    letter-spacing:1px;
    text-shadow:0 2px 12px rgba(255,176,0,.5);
}

.spec-item{
    font-size:1.9rem;
    font-weight:600;
    color:var(--white);
    margin:0 10px;
    font-family:var(--font-ar);
}

.spec-time{
    font-size:1.8rem;
    font-weight:600;
    color:rgba(255,255,255,.75);
    font-family:var(--font-mono);
    margin:0 5px;
}

.spec-sep{
    color:var(--accent);
    margin:0 18px;
    font-size:1.6rem;
    font-weight:700;
}

/* ========== RESPONSIVE ========== */
@media (max-width:1800px){
    .header-title h1{font-size:3.4rem}
    .specialty-name{font-size:5.8rem}
    .specialty-time{font-size:3.8rem}
}

@media (max-width:1600px){
    .main-container{
        padding:40px 60px;
        gap:40px;
    }
    
    .specialty-card{
        padding:70px 90px;
    }
    
    .specialty-name{
        font-size:5.2rem;
    }
    
    .specialty-time{
        font-size:3.2rem;
        padding:25px 70px;
    }
}

@media (max-width:1400px){
    .header{
        padding:20px 40px;
        gap:30px;
    }
    
    .main-container{
        grid-template-columns:1fr 400px;
    }
    
    .specialty-name{
        font-size:4.5rem;
    }
}

@media (max-width:1200px){
    .main-container{
        grid-template-columns:1fr;
        grid-template-rows:1fr auto;
        height:auto;
        min-height:calc(100vh - 380px);
    }
    
    .info-panel{
        flex-direction:row;
        justify-content:space-between;
    }
    
    .info-card{
        width:48%;
    }
}

@media (max-width:768px){
    .header{
        grid-template-columns:1fr;
        text-align:center;
        gap:20px;
    }
    
    .logo-box{
        display:none;
    }
    
    .main-container{
        padding:20px;
    }
    
    .specialty-card{
        padding:40px 30px;
    }
    
    .specialty-name{
        font-size:3rem;
        margin-bottom:30px;
    }
    
    .specialty-time{
        font-size:2.2rem;
        padding:20px 40px;
    }
    
    .info-panel{
        flex-direction:column;
    }
    
    .info-card{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- Background animé -->
<div class="bg-container">
    <div class="bg-grid"></div>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
</div>

<!-- Header -->
<header class="header">
    <div class="logo-box">
        <img src="d2.jpg" class="logo" alt="Logo Douanes" onerror="this.style.display='none'">
    </div>
    <div class="header-title" id="headerTitle">
        <h1 id="headerMainTitle">Direction Générale des Douanes</h1>
        <p id="headerSubTitle">Centre Médical Social – Sidi Bel Abbès</p>
    </div>
    <div class="logo-box">
        <img src="d1.png" class="logo" alt="Logo CMS" onerror="this.style.display='none'">
    </div>
</header>

<!-- Main Content -->
<main class="main-container">
    <!-- Specialty Display -->
    <div class="specialty-stage">
        <div class="specialty-card" id="specialtyCard">
            <div class="specialty-content" id="specialtyContent">
                <div class="specialty-name" id="specialtyName">---</div>
                <div class="specialty-time" id="specialtyTime"><span>--:--</span></div>
            </div>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <div class="info-card">
            <div class="info-label">
                <i class="fas fa-clock"></i>
                <span>Heure Actuelle</span>
            </div>
            <div class="clock-display" id="clockDisplay">00:00:00</div>
        </div>
        <div class="info-card">
            <div class="info-label" id="dateLabel">
                <i class="fas fa-calendar-alt"></i>
                <span id="dateLabelText">Date du Jour</span>
            </div>
            <div class="date-display" id="dateDisplay">---</div>
        </div>
    </div>
</main>

<!-- Ticker Bar -->
<footer class="ticker-container">
    <div class="ticker-lane">
        <div class="ticker-track french" id="tickerFR"></div>
    </div>
    <div class="ticker-lane">
        <div class="ticker-track arabic" id="tickerAR"></div>
    </div>
</footer>

<script>
/* ========== DATA ========== */
const planning = {
    dimanche: [
        {fr:"Gastro-entérologie", ar:"أمراض الجهاز الهضمي", time:"12:00–14:00"},
        {fr:"Pneumologie", ar:"أمراض الصدر", time:"13:00–15:00"},
        {fr:"Réadaptation", ar:"إعادة التأهيل", time:"11:30–15:30"},
        {fr:"Neurochirurgie", ar:"جراحة الأعصاب", time:"08:00–12:00"},
        {fr:"Kinésithérapie", ar:"العلاج الطبيعي", time:"13:30–15:30"}
    ],
    lundi: [
        {fr:"Endocrinologie", ar:"الغدد الصماء", time:"11:30–15:30"},
        {fr:"Cardiologie", ar:"أمراض القلب", time:"11:30–15:30"},
        {fr:"Urologie", ar:"المسالك البولية", time:"08:00–12:00"},
        {fr:"ORL", ar:"أنف وأذن وحنجرة", time:"13:00–15:00"}
    ],
    mardi: [
        {fr:"Ophtalmologie", ar:"طب العيون", time:"08:00–15:30"},
        {fr:"Dermatologie", ar:"الأمراض الجلدية", time:"12:30–14:30"},
        {fr:"Pédiatrie", ar:"طب الأطفال", time:"08:00–15:30"},
        {fr:"Psychiatrie", ar:"الطب النفسي", time:"11:30–15:30"},
        {fr:"Orthophoniste", ar:"تقويم النطق", time:"08:00–12:00"},
        {fr:"Traumatologie", ar:"جراحة العظام", time:"12:00–15:00"}
    ],
    mercredi: [
        {fr:"Ophtalmologie", ar:"طب العيون", time:"08:00–15:30"},
        {fr:"Dermatologie", ar:"الأمراض الجلدية", time:"12:30–14:30"},
        {fr:"Cardiologie", ar:"أمراض القلب", time:"11:30–15:30"}
    ],
    jeudi: [
        {fr:"Circulatoire", ar:"الأمراض الدموية", time:"10:00–14:00"},
        {fr:"Gastro-entérologie", ar:"أمراض الجهاز الهضمي", time:"12:00–14:00"},
        {fr:"Pneumologie", ar:"أمراض الصدر", time:"13:00–15:00"},
        {fr:"Endocrinologie", ar:"الغدد الصماء", time:"11:30–15:30"},
        {fr:"Néphrologie", ar:"أمراض الكلى", time:"08:00–12:00"},
        {fr:"Gynécologie", ar:"طب النساء والتوليد", time:"08:00–12:00"},
        {fr:"Kinésithérapie", ar:"العلاج الطبيعي", time:"13:30–15:30"},
        {fr:"ORL", ar:"أنف وأذن وحنجرة", time:"13:30–15:30"}
    ]
};

// CORRECTION DÉFINITIVE: L'ordre correct pour l'affichage dans le ticker
// Dimanche doit être en premier dans l'affichage, même si JavaScript le considère comme jour 0
const tickerOrder = ["dimanche", "lundi", "mardi", "mercredi", "jeudi"];

const daysFR = {
    dimanche:"DIMANCHE", lundi:"LUNDI", mardi:"MARDI",
    mercredi:"MERCREDI", jeudi:"JEUDI"
};
const daysAR = {
    dimanche:"الأحد", lundi:"الإثنين", mardi:"الثلاثاء",
    mercredi:"الأربعاء", jeudi:"الخميس"
};

// DOM Elements
const clockDisplay = document.getElementById('clockDisplay');
const dateDisplay = document.getElementById('dateDisplay');
const dateLabel = document.getElementById('dateLabel');
const dateLabelText = document.getElementById('dateLabelText');
const headerMainTitle = document.getElementById('headerMainTitle');
const headerSubTitle = document.getElementById('headerSubTitle');
const specialtyName = document.getElementById('specialtyName');
const specialtyTime = document.getElementById('specialtyTime');
const specialtyContent = document.getElementById('specialtyContent');
const tickerFR = document.getElementById('tickerFR');
const tickerAR = document.getElementById('tickerAR');

/* ========== CLOCK ========== */
function updateClock(){
    const now = new Date();
    clockDisplay.textContent = now.toLocaleTimeString("fr-FR",{
        hour:"2-digit", minute:"2-digit", second:"2-digit"
    });
    
    // Update date based on current language
    if(currentLang === 0){ // Arabic
        const options = {weekday:"long", day:"numeric", month:"long", year:"numeric"};
        const dateAr = now.toLocaleDateString("ar-DZ", options);
        dateDisplay.textContent = dateAr;
        dateDisplay.setAttribute('dir', 'rtl');
        dateLabel.setAttribute('dir', 'rtl');
        dateLabelText.textContent = "تاريخ اليوم";
    } else { // French
        dateDisplay.textContent = now.toLocaleDateString("fr-FR",{
            weekday:"long", day:"numeric", month:"long", year:"numeric"
        });
        dateDisplay.setAttribute('dir', 'ltr');
        dateLabel.setAttribute('dir', 'ltr');
        dateLabelText.textContent = "Date du Jour";
    }
}

/* ========== SPECIALTY ROTATION ========== */
let currentIndex = 0;
let currentLang = 0;
let rotationInterval;

// Header text content
const headerContent = {
    fr: {
        main: "Direction Générale des Douanes",
        sub: "Centre Médical Social – Sidi Bel Abbès"
    },
    ar: {
        main: "المديرية العامة للجمارك",
        sub: "المركز الطبي الاجتماعي – سيدي بلعباس"
    }
};

function rotateSpecialty(){
    const today = new Date().getDay(); // 0=dimanche, 1=lundi, etc.
    const dayNames = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
    const todayName = dayNames[today];
    
    const list = planning[todayName];
    if(!list || list.length === 0) {
        specialtyName.textContent = "Aucune spécialité aujourd'hui";
        specialtyTime.innerHTML = '<span>--:--</span>';
        return;
    }

    const item = list[currentIndex];
    
    // Exit animation
    specialtyContent.classList.remove('transition-enter');
    specialtyContent.classList.add('transition-exit');
    
    setTimeout(() => {
        // Update specialty content
        specialtyName.textContent = currentLang === 0 ? item.ar : item.fr;
        specialtyName.setAttribute('dir', currentLang === 0 ? 'rtl' : 'ltr');
        specialtyTime.innerHTML = `<span>${item.time}</span>`;
        
        // Update header
        const headerLang = currentLang === 0 ? 'ar' : 'fr';
        const headerDir = currentLang === 0 ? 'rtl' : 'ltr';
        headerMainTitle.textContent = headerContent[headerLang].main;
        headerSubTitle.textContent = headerContent[headerLang].sub;
        headerMainTitle.setAttribute('dir', headerDir);
        headerSubTitle.setAttribute('dir', headerDir);
        
        // Update date
        updateClock();
        
        // Enter animation
        specialtyContent.classList.remove('transition-exit');
        specialtyContent.classList.add('transition-enter');
        
    }, 1000);

    // Cycle
    currentLang++;
    if(currentLang > 1){
        currentLang = 0;
        currentIndex = (currentIndex + 1) % list.length;
    }
}

/* ========== TICKER BAR - CORRIGÉ DÉFINITIVEMENT ========== */
function buildTicker(){
    let htmlFR = '';
    let htmlAR = '';
    
    // Construction du ticker français
    htmlFR += `<div class="ticker-segment">`;
    htmlFR += `<span class="welcome-badge">🏥 BIENVENUE AU CENTRE MÉDICAL SOCIAL 🏥</span>`;
    
    // Construction du ticker arabe
    htmlAR += `<div class="ticker-segment">`;
    htmlAR += `<span class="welcome-badge">🏥 المركز الطبي الاجتماعي للجمارك سيدي بلعباس يرحب بكم 🏥</span>`;
    
    // CORRECTION: Utiliser tickerOrder qui est dans le bon ordre
    // Dimanche → Lundi → Mardi → Mercredi → Jeudi
    tickerOrder.forEach(day => {
        const dayFR = daysFR[day];
        const dayAR = daysAR[day];
        
        // Français - Jour puis spécialités (horaire d'abord, puis nom)
        htmlFR += `<span class="day-marker">${dayFR}</span>`;
        
        const specialties = planning[day];
        if(specialties){
            specialties.forEach((spec, idx) => {
                // Format: Horaire puis nom de spécialité
                htmlFR += `<span class="spec-time">${spec.time}</span>`;
                htmlFR += `<span class="spec-item">${spec.fr}</span>`;
                
                if(idx < specialties.length - 1){
                    htmlFR += `<span class="spec-sep">•</span>`;
                }
            });
        }
        
        // Arabe - Jour puis spécialités (nom d'abord, puis horaire)
        htmlAR += `<span class="day-marker">${dayAR}</span>`;
        
        if(specialties){
            specialties.forEach((spec, idx) => {
                htmlAR += `<span class="spec-item">${spec.ar}</span>`;
                htmlAR += `<span class="spec-time">${spec.time}</span>`;
                
                if(idx < specialties.length - 1){
                    htmlAR += `<span class="spec-sep">•</span>`;
                }
            });
        }
    });
    
    htmlFR += `</div>`;
    htmlAR += `</div>`;
    
    // Dupliquer 8x pour une boucle fluide
    const repeatFR = htmlFR.repeat(8);
    const repeatAR = htmlAR.repeat(8);
    
    // Insérer le contenu
    tickerFR.innerHTML = repeatFR;
    tickerAR.innerHTML = repeatAR;
    
    // Restart animations
    restartTickerAnimations();
}

function restartTickerAnimations(){
    // Stopper les animations en cours
    tickerFR.style.animation = 'none';
    tickerAR.style.animation = 'none';
    
    // Forcer un reflow
    void tickerFR.offsetWidth;
    void tickerAR.offsetWidth;
    
    // Redémarrer les animations avec la bonne direction
    // CORRECTION: Vitesse ajustable ici - changez 200 par la vitesse voulue
    const vitesseTicker = 600; // en secondes (200s = 3min20s)
    tickerFR.style.animation = `tickerScroll ${vitesseTicker}s linear infinite`;
    tickerAR.style.animation = `tickerScrollArabic ${vitesseTicker}s linear infinite`;
}

/* ========== INITIALIZATION ========== */
function init(){
    // Initialize clock
    updateClock();
    setInterval(updateClock, 1000);
    
    // Initialize specialty rotation
    rotateSpecialty();
    rotationInterval = setInterval(rotateSpecialty, 8000);
    
    // Build ticker
    buildTicker();
    
    // Redémarrer le ticker toutes les 5 minutes pour éviter les problèmes de synchronisation
    setInterval(() => {
        buildTicker();
    }, 300000); // 5 minutes
    
    // Handle window resize
    window.addEventListener('resize', () => {
        setTimeout(buildTicker, 100);
    });
}

// Start the application when DOM is loaded
document.addEventListener('DOMContentLoaded', init);
</script>
